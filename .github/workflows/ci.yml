name: CI / CD - Tests & Builds

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: 🧪 Run Tests & Build Production Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Backend dependencies
        run: |
          cd backend
          npm ci

      - name: 📦 Install Root / Storefront dependencies
        run: npm ci

      - name: 📦 Install Admin dependencies
        run: |
          cd admin
          npm ci

      - name: 🛡️ Run Vitest Test Suite (29 Security & Functional Tests)
        run: npm test

      - name: 🏗️ Build Storefront (Vite 7 + React 19)
        run: npm run build

      - name: 🏗️ Build Admin Dashboard (Vite 7)
        run: |
          cd admin
          npm run build
